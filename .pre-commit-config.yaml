# The checks are defined once, in noxfile.py; this hook and CI call them.
repos:
  - repo: local
    hooks:
      - id: nox-check
        name: lint, types, tests, REUSE and user interface (nox -s check)
        entry: uv run --frozen nox -s check
        language: system
        pass_filenames: false
        always_run: true
      - id: dco-sign-off
        name: DCO sign-off
        entry: uv run --frozen nox -s sign_off --
        language: system
        stages: [commit-msg]
