name: Bug report
description: Report something that does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. **Never report a vulnerability here**: follow SECURITY.md instead.
        Remove any secret or personal data from what you paste.
  - type: input
    id: version
    attributes:
      label: Version
      description: Version or commit of my-beautiful-choir.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - web mode
        - personal mode
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: MCP client and version (for example Claude Desktop 1.2.3), and operating system.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpts
      description: Relevant log lines, without secrets or personal data.
      render: text
